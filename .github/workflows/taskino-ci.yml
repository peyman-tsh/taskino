name: Deploy

on:
  push:
    branches:
      - master

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:

    needs: test

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      - name: Update repository
        shell: powershell
        run: |
          git -C "C:\Users\Administrator\Desktop\backend2\taskino" pull --ff-only origin master

      - name: Deploy
        shell: powershell
        run: |
          & "C:\Users\Administrator\Desktop\backend2\taskino\deploy.ps1"
