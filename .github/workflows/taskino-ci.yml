name: Test NestJS

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v5

      - name: نصب Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: نصب پکیج‌ها
        run: npm ci

      - name: اجرای تست
        run: npm run test

      - name: بیلد پروژه
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure VPS SSH access
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command \"Set-Location -LiteralPath '$VPS_APP_PATH'; if (Test-Path -LiteralPath '.\\deploy.ps1') { & '.\\deploy.ps1' } else { git pull --ff-only origin master; npm.cmd ci; npm.cmd run build; pm2.cmd reload taskino --update-env }\""
